#
# format-pr.yml
# When "PR Test Build" fails the comment-alignment check, offer the
# contributor a ready-made fix and comment on the PR.
#
# This runs with a privileged token, so it NEVER checks out or executes
# anything from the PR. The formatter and defaults come from a trusted
# checkout of the base branch. The PR's config files are downloaded as
# blobs through the API, reformatted as plain text, and committed back
# through the git data API (no fork worktree, no unsafe PR checkout).
#
# Optional secret FORMAT_BOT_TOKEN: a token (public_repo) that can open
# pull requests on contributors' forks. Without it, the comment gives
# instructions for pulling the fix branch instead.
#

name: Suggest Formatting

on:
  workflow_run:
    workflows: ["PR Test Build"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  suggest:

    name: Suggest Formatting
    if: >
      github.repository == 'MarlinFirmware/Configurations' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'

    runs-on: ubuntu-22.04

    steps:
    - name: Get the PR number
      uses: actions/download-artifact@v4
      with:
        name: format-needed
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Validate the PR number
      id: pr
      run: |
        # The artifact comes from the PR, so treat it as untrusted
        N=$(head -c 12 pr-number.txt | tr -d '[:space:]')
        [[ $N =~ ^[0-9]+$ ]] || { echo "::error::Bad PR number."; exit 1; }
        echo "number=$N" >>$GITHUB_OUTPUT

    - name: Check out the trusted formatter
      uses: actions/checkout@v7
      with:
        ref: import-2.1.x
        path: trusted

    - name: Format the changed configs and commit the fix to a branch here
      id: branch
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ steps.pr.outputs.number }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        API="repos/$GITHUB_REPOSITORY"
        mkdir work && cd work

        # Changed config files in the PR: "path<TAB>blob-sha"
        gh api "$API/pulls/$PR/files" --paginate --jq '
          .[] | select(.status != "removed")
              | select(.filename | test("(^|/)Configuration(_adv)?\\.h$"))
              | [.filename, .sha] | @tsv' >../changed.tsv
        [[ -s ../changed.tsv ]] || { echo "Nothing to format."; exit 0; }

        # Download each file as text into work/ (never executed)
        : >../files.txt
        while IFS=$'\t' read -r f sha; do
          [[ $f == /* || $f == ../* || $f == */../* ]] && { echo "::warning::Skipping odd path $f" >&2; continue; }
          mkdir -p "$(dirname "$f")"
          gh api "$API/git/blobs/$sha" --jq .content | base64 -d >"$f"
          printf '%s\0' "$f" >>../files.txt
          printf '%s\t%s\n' "$f" "$(git hash-object "$f")" >>../before.tsv
        done <../changed.tsv

        xargs -0 python3 ../trusted/bin/mfformat -D ../trusted/config/default -q <../files.txt

        # Blob and tree entries for the files that changed
        : >../entries.tsv
        while IFS=$'\t' read -r f old; do
          new=$(git hash-object "$f")
          [[ $new == "$old" ]] && continue
          # Send the body as a file (one argument can't exceed ~128 KB)
          base64 <"$f" | tr -d '\n' >../b64.txt
          jq -n --rawfile c ../b64.txt '{encoding: "base64", content: $c}' >../blob-req.json
          blob=$(gh api "$API/git/blobs" --input ../blob-req.json --jq .sha)
          printf '%s\t%s\n' "$f" "$blob" >>../entries.tsv
        done <../before.tsv
        [[ -s ../entries.tsv ]] || { echo "Already aligned."; exit 0; }

        # A tree on top of the PR's head, then a commit, then the branch
        jq -Rn --arg base "$HEAD_SHA" '{
          base_tree: $base,
          tree: [inputs | split("\t") | {path: .[0], mode: "100644", type: "blob", sha: .[1]}]
        }' <../entries.tsv >../tree-req.json
        TREE=$(gh api "$API/git/trees" --input ../tree-req.json --jq .sha)

        jq -n --arg tree "$TREE" --arg parent "$HEAD_SHA" \
          '{message: "🎨 Align comments (mfformat)", tree: $tree, parents: [$parent]}' >../commit-req.json
        COMMIT=$(gh api "$API/git/commits" --input ../commit-req.json --jq .sha)

        BRANCH="mfformat/pr-$PR"
        gh api -X POST "$API/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$COMMIT" \
          || gh api -X PATCH "$API/git/refs/heads/$BRANCH" -f sha="$COMMIT" -F force=true
        echo "name=$BRANCH" >>$GITHUB_OUTPUT

    # Open a PR on the contributor's fork, if the token allows it
    - name: Open a PR on the source fork
      id: forkpr
      if: steps.branch.outputs.name
      env:
        GH_TOKEN: ${{ secrets.FORMAT_BOT_TOKEN }}
        FORK: ${{ github.event.workflow_run.head_repository.full_name }}
        TARGET: ${{ github.event.workflow_run.head_branch }}
        BRANCH: ${{ steps.branch.outputs.name }}
        PR: ${{ steps.pr.outputs.number }}
      run: |
        [[ -n $GH_TOKEN ]] || { echo "No FORMAT_BOT_TOKEN; skipping."; exit 0; }
        OWNER=${GITHUB_REPOSITORY%%/*}
        URL=$(gh pr list --repo "$FORK" --base "$TARGET" --head "$OWNER:$BRANCH" --state open --json url --jq '.[0].url // empty' || true)
        if [[ -z $URL ]]; then
          URL=$(gh pr create --repo "$FORK" --base "$TARGET" --head "$OWNER:$BRANCH" \
            --title "🎨 Align comments (mfformat)" \
            --body "Aligns end-of-line comments with config/default, as required by MarlinFirmware/Configurations#$PR. Merge this to fix the failing check." || true)
        fi
        echo "url=$URL" >>$GITHUB_OUTPUT

    - name: Comment on the PR
      if: steps.branch.outputs.name
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ steps.pr.outputs.number }}
        BRANCH: ${{ steps.branch.outputs.name }}
        FORKPR: ${{ steps.forkpr.outputs.url }}
      run: |
        {
          echo "### 🎨 Comment alignment needed"
          echo
          echo "The end-of-line comments in the changed configs don't line up with \`config/default\`, so the **Check Comment Alignment** test failed."
          echo
          if [[ -n $FORKPR ]]; then
            echo "**Merge this pull request into your branch to fix it:** $FORKPR"
          else
            echo "A fix is on this branch: \`$BRANCH\`. Merge it into yours:"
            echo '```sh'
            echo "git pull https://github.com/$GITHUB_REPOSITORY.git $BRANCH"
            echo '```'
          fi
          echo
          echo "Or fix it yourself and push: \`bin/mfformat <changed Configuration files>\`."
        } >comment.md
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md --edit-last --create-if-none
